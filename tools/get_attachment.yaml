identity:
  name: get_attachment
  author: photon-hq
  label:
    en_US: Get attachment
    zh_Hans: 获取附件
description:
  human:
    en_US: Fetch an attachment's metadata and file by the ID from a message's attachment_ids. The file is returned to Dify as a file output, for example to pass an image to a vision model. Files over 50 MB, Dify's default limit for plugin files, are not downloaded.
    zh_Hans: 根据消息 attachment_ids 中的 ID 获取附件的元数据和文件。文件会作为 Dify 文件输出返回，例如可以把图片传给视觉模型。超过 50 MB（Dify 对插件返回文件的默认上限）的文件不会下载。
  llm: Fetch an attachment's metadata and file by the ID from a message's attachment_ids. The file is returned to Dify as a file output, for example to pass an image to a vision model. Files over 50 MB, Dify's default limit for plugin files, are not downloaded.
parameters:
- name: attachment_id
  type: string
  required: true
  label:
    en_US: Attachment ID
    zh_Hans: 附件 ID
  human_description:
    en_US: Attachment ID (pho_att_…) from a message's attachment_ids.
    zh_Hans: 消息 attachment_ids 中的附件 ID（pho_att_…）。
  llm_description: Attachment ID (pho_att_…) from a message's attachment_ids.
  form: llm
output_schema:
  type: object
  properties:
    id:
      type: string
    filename:
      type:
      - string
      - 'null'
    content_type:
      type: string
    size_bytes:
      type:
      - integer
      - 'null'
    created_at:
      type:
      - string
      - 'null'
  required:
  - id
  - filename
  - content_type
  - size_bytes
  - created_at
  additionalProperties: false
extra:
  python:
    source: tools/get_attachment.py
