identity:
  name: list_spaces
  author: photon-hq
  label:
    en_US: List spaces
    zh_Hans: 查看会话
description:
  human:
    en_US: List one page of spaces (conversations) across iMessage, SMS, WhatsApp, WhatsApp Business, email, and Telegram, optionally for one platform or participant. participantIds are user IDs; get_user shows each one's handle and whether it is the project's agent.
    zh_Hans: 分页查看 iMessage、短信、WhatsApp、WhatsApp Business、电子邮件和 Telegram 上的会话（space），可按单个渠道或参与者筛选。participantIds 是用户 ID，可用 get_user 查看每个用户的联系方式，以及是否为项目的代理用户。
  llm: List one page of spaces (conversations) across iMessage, SMS, WhatsApp, WhatsApp Business, email, and Telegram, optionally for one platform or participant. participantIds are user IDs; get_user shows each one's handle and whether it is the project's agent.
parameters:
- name: platform
  type: select
  required: false
  label:
    en_US: Platform
    zh_Hans: 渠道
  human_description:
    en_US: Optional channel filter. Omit to include every channel in the project.
    zh_Hans: 可选的渠道筛选。省略时包含项目中的所有渠道。
  llm_description: Optional channel filter. Omit to include every channel in the project.
  form: llm
  options:
  - value: imessage
    label:
      en_US: iMessage
      zh_Hans: iMessage
  - value: sms
    label:
      en_US: SMS
      zh_Hans: 短信（SMS）
  - value: whatsapp
    label:
      en_US: WhatsApp
      zh_Hans: WhatsApp
  - value: whatsapp_business
    label:
      en_US: WhatsApp Business
      zh_Hans: WhatsApp Business
  - value: email
    label:
      en_US: Email
      zh_Hans: 电子邮件
  - value: telegram
    label:
      en_US: Telegram
      zh_Hans: Telegram
- name: page_size
  type: number
  required: false
  label:
    en_US: Page size
    zh_Hans: 每页数量
  human_description:
    en_US: Default 20; Photon returns at most 100 per page.
    zh_Hans: 默认 20；Photon 每页最多返回 100 条。
  llm_description: Default 20; Photon returns at most 100 per page.
  form: llm
  default: 20
  min: 1
- name: page_token
  type: string
  required: false
  label:
    en_US: Page token
    zh_Hans: 分页令牌
  human_description:
    en_US: nextPageToken from the previous result, to get the next page; keep the other parameters unchanged. Only needed for more results.
    zh_Hans: 上一次结果中的 nextPageToken，用于获取下一页，其他参数保持不变。只在需要更多结果时传入。
  llm_description: nextPageToken from the previous result, to get the next page; keep the other parameters unchanged. Only needed for more results.
  form: llm
- name: participant_handle
  type: string
  required: false
  label:
    en_US: Participant handle
    zh_Hans: 参与者联系方式
  human_description:
    en_US: Optional participant phone number or email address, for example +14155550123. Matching is case-insensitive.
    zh_Hans: 可选的参与者电话号码或电子邮箱，例如 +14155550123。匹配时不区分大小写。
  llm_description: Optional participant phone number or email address, for example +14155550123. Matching is case-insensitive.
  form: llm
- name: order
  type: select
  required: false
  label:
    en_US: Order
    zh_Hans: 排序方式
  human_description:
    en_US: Newest first by default (desc); asc lists oldest first.
    zh_Hans: 默认按从新到旧排序（desc）；asc 表示从旧到新。
  llm_description: Newest first by default (desc); asc lists oldest first.
  form: llm
  default: desc
  options:
  - value: desc
    label:
      en_US: desc
      zh_Hans: 从新到旧（降序）
  - value: asc
    label:
      en_US: asc
      zh_Hans: 从旧到新（升序）
output_schema:
  type: object
  properties:
    items:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
          platform:
            type: string
          kind:
            type: string
          participantIds:
            type: array
            items:
              type: string
          metadata:
            type: object
          createdAt:
            type: string
          updatedAt:
            type: string
    nextPageToken:
      type: string
extra:
  python:
    source: tools/list_spaces.py
