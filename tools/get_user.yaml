identity:
  name: get_user
  author: photon-hq
  label:
    en_US: Get user
    zh_Hans: 获取用户
description:
  human:
    en_US: Fetch one Photon user by ID, with its handle (phone number, email address, or Telegram account) and kind, which is agent for a line or account Photon manages and human for everyone else. In details, this project's dedicated lines have resourceId, another project's only managedBy, and shared lines have type shared. Use it to tell which participant of a space is the project's agent.
    zh_Hans: 根据 ID 获取一个 Photon 用户，包括联系方式（电话号码、电子邮箱或 Telegram 账号）和 kind：Photon 托管的号码或账号是 agent，其他人是 human。在 details 中，本项目的专属号码带 resourceId，其他项目的专属号码只带 managedBy，共享号码的 type 为 shared。可用来判断会话的参与者中哪个是项目的代理用户。
  llm: Fetch one Photon user by ID, with its handle (phone number, email address, or Telegram account) and kind, which is agent for a line or account Photon manages and human for everyone else. In details, this project's dedicated lines have resourceId, another project's only managedBy, and shared lines have type shared. Use it to tell which participant of a space is the project's agent.
parameters:
- name: user_id
  type: string
  required: true
  label:
    en_US: User ID
    zh_Hans: 用户 ID
  human_description:
    en_US: Photon user ID (pho_usr_…), for example from a space's participantIds or a message's sentBy.id.
    zh_Hans: Photon 用户 ID（pho_usr_…），例如会话的 participantIds 或消息的 sentBy.id。
  llm_description: Photon user ID (pho_usr_…), for example from a space's participantIds or a message's sentBy.id.
  form: llm
output_schema:
  type: object
  properties:
    id:
      type: string
    platform:
      type: string
    kind:
      type: string
    handle:
      type: string
    details:
      type: object
    metadata:
      type: object
    createdAt:
      type: string
    updatedAt:
      type: string
extra:
  python:
    source: tools/get_user.py
