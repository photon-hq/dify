identity:
  name: list_messages
  author: photon-hq
  label:
    en_US: List messages
    zh_Hans: 查看消息
description:
  human:
    en_US: List one page of messages across all channels, or one platform. Optional space_id filters the fetched project page locally; an empty items array may still have a next_page_token. Continue until the token is null.
    zh_Hans: 分页查看所有渠道或单个渠道的消息。可选的 space_id 在本地筛选已读取的项目消息页；即使 items 数组为空，也可能存在 next_page_token，应继续查询直到令牌为 null。
  llm: List one page of messages across all channels, or one platform. Optional space_id filters the fetched project page locally; an empty items array may still have a next_page_token. Continue until the token is null.
parameters:
- name: platform
  type: select
  required: false
  label:
    en_US: Platform
    zh_Hans: 渠道
  human_description:
    en_US: Optional channel filter. Omit to include every channel in the project.
    zh_Hans: 可选的渠道筛选。省略时包含项目中的所有渠道。
  llm_description: Optional channel filter. Omit to include every channel in the project.
  form: llm
  options:
  - value: imessage
    label:
      en_US: iMessage
      zh_Hans: iMessage
  - value: sms
    label:
      en_US: SMS
      zh_Hans: 短信（SMS）
  - value: whatsapp
    label:
      en_US: WhatsApp
      zh_Hans: WhatsApp
  - value: whatsapp_business
    label:
      en_US: WhatsApp Business
      zh_Hans: WhatsApp Business
  - value: email
    label:
      en_US: Email
      zh_Hans: 电子邮件
  - value: telegram
    label:
      en_US: Telegram
      zh_Hans: Telegram
- name: space_id
  type: string
  required: false
  label:
    en_US: Space ID
    zh_Hans: 会话 ID
  human_description:
    en_US: Optional pho_spc_ ID. Applied locally to each upstream page; page_size limits scanned project messages, not matching messages.
    zh_Hans: 可选的会话 ID（pho_spc_），在本地对每页 Photon 结果进行筛选；page_size 限制读取的项目消息数，并非匹配的消息数。
  llm_description: Optional pho_spc_ ID. Applied locally to each upstream page; page_size limits scanned project messages, not matching messages.
  form: llm
- name: direction
  type: select
  required: false
  label:
    en_US: Direction
    zh_Hans: 消息方向
  human_description:
    en_US: received for inbound messages; sent for outbound messages with any delivery status. Omit for both.
    zh_Hans: received 表示入站消息；sent 表示任意投递状态的出站消息。省略时同时返回两个方向。
  llm_description: received for inbound messages; sent for outbound messages with any delivery status. Omit for both.
  form: llm
  options:
  - value: received
    label:
      en_US: received
      zh_Hans: 接收（received）
  - value: sent
    label:
      en_US: sent
      zh_Hans: 发送（sent）
- name: order
  type: select
  required: false
  label:
    en_US: Order
    zh_Hans: 排序方式
  human_description:
    en_US: Newest first by default (desc); asc lists oldest first.
    zh_Hans: 默认按从新到旧排序（desc）；asc 表示从旧到新。
  llm_description: Newest first by default (desc); asc lists oldest first.
  form: llm
  default: desc
  options:
  - value: desc
    label:
      en_US: desc
      zh_Hans: 从新到旧（降序）
  - value: asc
    label:
      en_US: asc
      zh_Hans: 从旧到新（升序）
- name: page_size
  type: number
  required: false
  label:
    en_US: Page size
    zh_Hans: 每页数量
  human_description:
    en_US: Default 20; Photon returns at most 200 per page.
    zh_Hans: 默认 20；Photon 每页最多返回 200 条。
  llm_description: Default 20; Photon returns at most 200 per page.
  form: llm
  default: 20
  min: 1
- name: page_token
  type: string
  required: false
  label:
    en_US: Page token
    zh_Hans: 分页令牌
  human_description:
    en_US: Unchanged next_page_token from the previous result. Keep all filters unchanged, even after an empty page.
    zh_Hans: 原样传入上一次结果中的 next_page_token。即使上一页为空，也应保持所有筛选条件不变。
  llm_description: Unchanged next_page_token from the previous result. Keep all filters unchanged, even after an empty page.
  form: llm
- name: created_since
  type: string
  required: false
  label:
    en_US: Created since
    zh_Hans: 创建时间起点
  human_description:
    en_US: Inclusive lower creation-time bound, RFC 3339 with timezone; for example 2026-10-19T00:00:00Z.
    zh_Hans: 创建时间下限（含），须为带时区的 RFC 3339 时间，例如 2026-10-19T00:00:00Z。
  llm_description: Inclusive lower creation-time bound, RFC 3339 with timezone; for example 2026-10-19T00:00:00Z.
  form: llm
- name: created_before
  type: string
  required: false
  label:
    en_US: Created before
    zh_Hans: 创建时间上限
  human_description:
    en_US: Exclusive upper creation-time bound, RFC 3339 with timezone.
    zh_Hans: 创建时间上限（不含），须为带时区的 RFC 3339 时间。
  llm_description: Exclusive upper creation-time bound, RFC 3339 with timezone.
  form: llm
output_schema:
  type: object
  properties:
    items:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
          platform:
            type: string
          space_id:
            type: string
          direction:
            type: string
            enum:
            - received
            - sent
          type:
            type: string
          text:
            type:
            - string
            - 'null'
          attachment_ids:
            type: array
            items:
              type: string
          content:
            type: object
          parent_message_id:
            type:
            - string
            - 'null'
          status:
            type: string
            enum:
            - received
            - dispatched
            - accepted
            - delivered
            - failed
          delivery_confirmed:
            type: boolean
          timestamps:
            type: object
            properties:
              created_at:
                type:
                - string
                - 'null'
              updated_at:
                type:
                - string
                - 'null'
              received_at:
                type:
                - string
                - 'null'
              dispatched_at:
                type:
                - string
                - 'null'
              accepted_at:
                type:
                - string
                - 'null'
              delivered_at:
                type:
                - string
                - 'null'
              failed_at:
                type:
                - string
                - 'null'
            required:
            - created_at
            - updated_at
            - received_at
            - dispatched_at
            - accepted_at
            - delivered_at
            - failed_at
            additionalProperties: false
          failure:
            type:
            - object
            - 'null'
            properties:
              code:
                type:
                - string
                - 'null'
              message:
                type:
                - string
                - 'null'
              confirmed_recipient_count:
                type:
                - integer
                - 'null'
            required:
            - code
            - message
            - confirmed_recipient_count
            additionalProperties: false
        required:
        - id
        - platform
        - space_id
        - direction
        - type
        - text
        - attachment_ids
        - content
        - parent_message_id
        - status
        - delivery_confirmed
        - timestamps
        - failure
        additionalProperties: false
    next_page_token:
      type:
      - string
      - 'null'
    scanned_count:
      type: integer
    space_filter_applied_locally:
      type: boolean
  required:
  - items
  - next_page_token
  - scanned_count
  - space_filter_applied_locally
  additionalProperties: false
extra:
  python:
    source: tools/list_messages.py
