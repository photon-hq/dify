settings:
- name: api_key
  type: secret-input
  required: true
  label:
    en_US: Photon API key
    zh_Hans: Photon API 密钥
  help:
    en_US: Account Service Key (pho_ask_) or Project API key (pho_sk_), used to send the replies. Enter the raw key without Bearer. Project keys must belong to the project whose messages this endpoint answers.
    zh_Hans: 账号服务密钥（pho_ask_）或项目 API 密钥（pho_sk_），用于发送回复。直接填写原始密钥，无需添加 Bearer。项目密钥必须属于本端点所回复消息的项目。
  placeholder:
    en_US: Photon API key
    zh_Hans: Photon API 密钥
  url: https://photon.codes
- name: signing_secret
  type: secret-input
  required: false
  label:
    en_US: Signing secret
    zh_Hans: 签名密钥
  help:
    en_US: The whsec_ secret Photon returned when you created the webhook destination for this endpoint's URL. Until it is set, every delivery is rejected.
    zh_Hans: 为本端点地址创建 Photon 推送地址时 Photon 返回的 whsec_ 密钥。填写之前，所有推送都会被拒绝。
- name: app
  type: app-selector
  required: true
  label:
    en_US: App
    zh_Hans: 应用
  help:
    en_US: The Chatflow or Chatbot app that answers the messages.
    zh_Hans: 用来回复消息的 Chatflow 或聊天助手应用。
endpoints:
- endpoints/photon_bot.yaml
