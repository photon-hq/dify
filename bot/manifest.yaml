version: 0.1.1
type: plugin
author: photon-hq
name: photon_bot
label:
  en_US: Photon Bot
  zh_Hans: Photon 机器人
description:
  en_US: Answer messages on iMessage, SMS, WhatsApp, WhatsApp Business, email, and Telegram with a Dify chat app, through Photon.
  zh_Hans: 通过 Photon，用 Dify 聊天应用回复 iMessage、短信、WhatsApp、WhatsApp Business、电子邮件和 Telegram 上的消息。
icon: icon.svg
icon_dark: icon-dark.svg
resource:
  memory: 268435456
  permission:
    endpoint:
      enabled: true
    app:
      enabled: true
    storage:
      enabled: true
      size: 104857600
plugins:
  endpoints:
    - group/photon_bot.yaml
meta:
  version: 0.0.1
  arch:
    - amd64
    - arm64
  runner:
    language: python
    version: "3.12"
    entrypoint: main
  minimum_dify_version: "1.17.1"
privacy: PRIVACY.md
repo: https://github.com/photon-hq/dify
contact: help@photon.codes
network:
  domains:
    - api.photon.codes
    - api.staging.photon.codes
verified: false
created_at: "2026-10-22T08:20:58Z"
